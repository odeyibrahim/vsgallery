<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - V. Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Copperplate', 'Georgia', serif;
            background: linear-gradient(135deg, #f8f8f8 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 30px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: monospace;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }
        button:hover {
            background: #333;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error {
            color: #c62828;
            margin-bottom: 15px;
            font-size: 12px;
            display: none;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #888;
        }
        .footer a {
            color: #888;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">V.</div>
        <h1>Admin Access</h1>
        <div id="error" class="error"></div>
        <input type="password" id="password" placeholder="Enter password" autofocus>
        <button id="loginBtn" onclick="login()">Login</button>
        <div class="footer">
            <a href="/">← Return to Gallery</a>
        </div>
    </div>
    <script>
        async function login() {
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const btn = document.getElementById('loginBtn');

            if (!password) {
                errorDiv.textContent = 'Please enter password';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Checking…';

            try {
                const response = await fetch('/.netlify/functions/admin-operations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ operation: 'login', data: { password: password } })
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('admin_token', result.token);
                    window.location.href = '/admin/dashboard.html';
                } else {
                    errorDiv.textContent = result.error || 'Login failed';
                    errorDiv.style.display = 'block';
                    document.getElementById('password').value = '';
                }
            } catch (err) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        if (localStorage.getItem('admin_token')) {
            window.location.href = '/admin/dashboard.html';
        }
    </script>
</body>
</html>
