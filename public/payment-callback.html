<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status - V. Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Copperplate', 'Georgia', serif;
            background: #f8f8f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 18px; font-weight: 400; margin-bottom: 12px; }
        p { font-size: 13px; color: #666; margin-bottom: 8px; line-height: 1.5; }
        .order-number { font-family: monospace; font-size: 13px; background: #f0f0f0; padding: 8px 12px; border-radius: 6px; display: inline-block; margin: 12px 0; }
        a.back-link {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 28px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #eee; border-top-color: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="spinner"></div>
        <h1>Confirming your payment…</h1>
        <p>Please don't close this page.</p>
    </div>

    <script>
        (async function () {
            const params = new URLSearchParams(window.location.search);
            const provider = params.get('provider');
            const reference = params.get('reference') || params.get('tx_ref');
            const transactionId = params.get('transaction_id');

            const card = document.getElementById('card');

            if (!provider || !reference) {
                card.innerHTML = `
                    <div class="icon">⚠️</div>
                    <h1>Missing payment details</h1>
                    <p>We couldn't read the payment reference from this link.</p>
                    <a class="back-link" href="/">Return to Gallery</a>
                `;
                return;
            }

            try {
                const url = `/.netlify/functions/verify-payment?provider=${encodeURIComponent(provider)}&reference=${encodeURIComponent(reference)}` +
                    (transactionId ? `&transaction_id=${encodeURIComponent(transactionId)}` : '');
                const response = await fetch(url);
                const data = await response.json();

                if (data.verified || data.payment_status === 'paid') {
                    card.innerHTML = `
                        <div class="icon">✓</div>
                        <h1>Payment confirmed</h1>
                        <p>Thank you for your order.</p>
                        <div class="order-number">${data.order_number || reference}</div>
                        <p>A confirmation has been recorded. We'll be in touch about shipping.</p>
                        <a class="back-link" href="/">Return to Gallery</a>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="icon">⏳</div>
                        <h1>Still processing</h1>
                        <p>We haven't received final confirmation yet. This can take a minute —
                        your order will update automatically once it's confirmed.</p>
                        <div class="order-number">${data.order_number || reference}</div>
                        <a class="back-link" href="/">Return to Gallery</a>
                    `;
                }
            } catch (e) {
                card.innerHTML = `
                    <div class="icon">⚠️</div>
                    <h1>Couldn't confirm status</h1>
                    <p>If money left your account, your order will still be confirmed automatically —
                    contact us if you don't see an update soon.</p>
                    <div class="order-number">${reference}</div>
                    <a class="back-link" href="/">Return to Gallery</a>
                `;
            }
        })();
    </script>
</body>
</html>
