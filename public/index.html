<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>V. Gallery · Art + Commerce</title>
    <link href="https://fonts.cdnfonts.com/css/copperplate" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto+Mono&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="site-logo" id="siteLogo">V.</div>
    <button class="grid-icon-top" id="gridIconTop">☷</button>
    <div class="gallery-brand" id="galleryBrand">v.gallery.shop</div>

    <div class="intro-overlay" id="introOverlay">
        <div>
            <div class="intro-poem">"Be still, and know that I am God."</div>
            <div style="font-size: 12px; margin-top: 10px;">— Psalm 46:10</div>
            <button class="enter-gallery" id="enterGalleryBtn" style="margin-top: 40px;">Enter Gallery</button>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <div class="notification" id="notification"></div>

    <div class="split-container" id="splitContainer">
        <div class="product-half" id="productHalf">
            <div class="frame-container">
                <div class="product-frame" id="productFrame">
                    <img src="" alt="Product" class="product-image" id="mainImage">
                </div>
            </div>
        </div>
        <div class="info-half">
            <div class="info-container">
                <div class="description" id="descriptionText">Loading...</div>
                <div class="title-author">
                    <span id="productTitle">-</span>
                    <span>—</span>
                    <span id="productCreator">V.</span>
                    <button class="icon-button share" id="shareButton" title="Share">↗</button>
                    <button class="icon-button" id="cartButton" title="Cart">🛒</button>
                    <button class="icon-button heart" id="heartButton" title="Save">♡</button>
                </div>
                <div class="price-row">
                    <span class="price-tag" id="priceTag"></span>
                    <button class="currency-selector" id="currencyDisplay">USD</button>
                    <span class="stock-badge" id="stockBadge"></span>
                </div>
            </div>
        </div>
        <nav class="bottom-nav">
            <div></div>
            <div class="nav-arrows">
                <button class="arrow-btn" id="prevBtn" disabled>‹</button>
                <span id="pageIndicator">1/1</span>
                <button class="arrow-btn" id="nextBtn">›</button>
            </div>
        </nav>
    </div>

    <div class="grid-overlay" id="gridOverlay">
        <div class="grid-header">
            <div class="grid-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="original">Originals</button>
                <button class="filter-btn" data-filter="print">Prints</button>
                <button class="filter-btn" data-filter="merch">Merch</button>
                <button class="filter-btn" data-filter="saved">♥ Saved</button>
            </div>
            <button onclick="app.closeGrid()" style="background:none; border:none; font-size: 24px; cursor: pointer;">←</button>
        </div>
        <div class="grid-container" id="gridContainer"></div>
    </div>

    <div class="checkout-overlay" id="checkoutOverlay" onclick="if(event.target===this)app.closeCheckout()"></div>
    <div class="checkout-panel" id="checkoutPanel">
        <h2 style="margin-bottom: 20px;">Checkout</h2>
        <div id="checkoutProductPreview"></div>
        <div style="display: flex; gap: 20px; margin: 20px 0; align-items: center;">
            <button onclick="app.updateQuantity(-1)" style="padding: 8px 16px; font-size: 18px;">-</button>
            <span id="checkoutQuantity" style="font-size: 18px; min-width: 40px; text-align: center;">1</span>
            <button onclick="app.updateQuantity(1)" style="padding: 8px 16px; font-size: 18px;">+</button>
        </div>
        <div style="margin: 20px 0;">
            <span>Total: </span>
            <span id="checkoutTotal" style="font-size: 20px; font-weight: bold;"></span>
        </div>
        <input type="email" id="checkoutEmail" placeholder="Email address" style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px;">
        <input type="text" id="checkoutName" placeholder="Full name" style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px;">
        <input type="tel" id="checkoutPhone" placeholder="Phone (optional)" style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px;">
        <input type="text" id="checkoutAddress" placeholder="Shipping address" style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px;">
        <select id="checkoutShippingSelect" style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px;">
            <option value="standard">Standard Shipping ($7)</option>
            <option value="express">Express Shipping ($15)</option>
        </select>

        <div class="payment-method-options" id="paymentMethodOptions">
            <label class="payment-method-option selected">
                <input type="radio" name="paymentProvider" value="paystack" checked>
                Card / Bank via Paystack
            </label>
            <label class="payment-method-option">
                <input type="radio" name="paymentProvider" value="flutterwave">
                Card / Bank via Flutterwave
            </label>
            <label class="payment-method-option">
                <input type="radio" name="paymentProvider" value="bank_transfer">
                Direct Bank / Domiciliary Transfer
            </label>
        </div>

        <div class="payment-buttons">
            <button class="paystack-btn" onclick="app.processPayment()">Place Order</button>
        </div>

        <div class="bank-details-panel" id="bankDetailsPanel">
            <h4>Local Bank Account (NGN)</h4>
            <div class="bank-block" id="bankLocalDetails"></div>
            <h4>Domiciliary Account (USD)</h4>
            <div class="bank-block" id="bankDomDetails"></div>
            <p>Use reference <strong id="bankRefNumber"></strong> when transferring, then send proof of payment below.</p>
            <button class="whatsapp-proof-btn" id="whatsappProofBtn">Send Proof via WhatsApp</button>
        </div>

        <button onclick="app.closeCheckout()" style="width: 100%; margin-top: 16px; padding: 12px; background: none; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;">Close</button>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
